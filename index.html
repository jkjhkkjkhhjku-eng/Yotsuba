<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Moon</title>
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To Moon">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>

<!-- Firebase (compat build, served from cdnjs). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.5/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.5/firebase-firestore-compat.min.js"></script>
<style>
  :root {
    --bg: #050505;
    --surface: #0d0d0d;
    --surface2: #131313;
    --border: #232323;
    --border-strong: #363636;
    --text: #e8e8e6;
    --text-secondary: #8a8a86;
    --text-muted: #55554f;
    --accent: #8fb4c4;
    --accent-text: #b8d4e0;
    --success: #d7d7d2;
    --success-text: #050505;
    --amber: #8fb4c4;
    --amber-text: #b8d4e0;
    --coral: #b45a4a;
    --todo-accent: #f5a623;
    --todo-accent-ink: #1a1200;
    --radius: 2px;
    font-synthesis: none;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eeeeec;
      --surface: #f8f8f6;
      --surface2: #e6e6e2;
      --border: #cfcfc9;
      --border-strong: #a8a8a0;
      --text: #101010;
      --text-secondary: #52524c;
      --text-muted: #86867e;
      --accent: #35576a;
      --accent-text: #2a4655;
      --success: #101010;
      --success-text: #f8f8f6;
      --amber: #35576a;
      --amber-text: #2a4655;
      --coral: #8a3f30;
      --todo-accent: #d9860f;
      --todo-accent-ink: #fffaf0;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root:not([data-theme="dark"]) { color-scheme: light dark; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  * { box-sizing: border-box; }

  #bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    background: #000;
    pointer-events: none;
  }
  #bgScrim {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    color: var(--text);
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    z-index: 10;
    padding: 16px 16px 14px;
    margin: -24px -16px 20px;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 3px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .sub {
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .sync-status {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 5px;
  }
  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    color: var(--text-secondary);
    width: 26px;
    height: 26px;
    font-size: 11px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .theme-toggle:active { transform: scale(0.85) rotate(-12deg); }

  nav.tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    margin-top: 16px;
    padding-bottom: 0;
    border-bottom: 1px solid var(--border);
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  #content { touch-action: pan-y; overflow-x: hidden; }
  .swipe-track {
    display: flex;
    width: 200%;
    will-change: transform;
  }
  .swipe-panel {
    flex: 0 0 50%;
    min-width: 0;
    max-width: 50%;
    contain: layout style paint;
  }
  /* Suppress background-color/border transitions while actively dragging —
     avoids extra paint work fighting the swipe transform each frame. */
  body.swiping .card,
  body.swiping header.top {
    transition: none !important;
  }

  @keyframes cardEnterRight { from { opacity: 0; transform: translate3d(16px, 8px, 0); } to { opacity: 1; transform: none; } }
  @keyframes cardEnterLeft  { from { opacity: 0; transform: translate3d(-16px, 8px, 0); } to { opacity: 1; transform: none; } }
  #content.tab-in-right > .card { animation: cardEnterRight 0.32s cubic-bezier(.22,1,.36,1) both; }
  #content.tab-in-left  > .card { animation: cardEnterLeft 0.32s cubic-bezier(.22,1,.36,1) both; }
  #content.tab-in-right > .card:nth-child(2), #content.tab-in-left > .card:nth-child(2) { animation-delay: 0.04s; }
  #content.tab-in-right > .card:nth-child(3), #content.tab-in-left > .card:nth-child(3) { animation-delay: 0.08s; }
  #content.tab-in-right > .card:nth-child(4), #content.tab-in-left > .card:nth-child(4) { animation-delay: 0.12s; }
  #content.tab-in-right > .card:nth-child(n+5), #content.tab-in-left > .card:nth-child(n+5) { animation-delay: 0.16s; }
  .tab {
    flex: 0 0 auto;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 13px;
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
    margin-bottom: -1px;
    transition: color 0.2s ease, border-color 0.25s ease, transform 0.12s ease;
  }
  .tab:active { transform: scale(0.93); }
  .tab.active {
    background: none;
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .card {
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 18px 18px;
    margin-bottom: 12px;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .card h2 {
    font-size: 11px;
    font-weight: 600;
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
  }
  .card h3 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 16px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .card h3:first-child { margin-top: 0; }

  .phase-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .phase-banner .name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .phase-banner .range { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.02em; }
  .phase-pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 0;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    flex: 0 0 auto;
  }
  .progress-row { margin-top: 14px; }
  .progress-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 0;
    transition: width 0.5s cubic-bezier(.22,1,.36,1);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 7px;
    letter-spacing: 0.02em;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .stat {
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    border-radius: 0;
    padding: 13px;
    transition: background-color 0.3s ease;
  }
  .stat .label { font-size: 10.5px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.07em; }
  .stat .value { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }

  .habit-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .habit-row:last-child { border-bottom: none; }
  .habit-check {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 0;
    border: 1px solid var(--border-strong);
    background: none;
    cursor: pointer;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 12px;
    font-weight: 700;
    transition: background 0.15s, border-color 0.15s, transform 0.12s ease;
  }
  .habit-check:active { transform: scale(0.88); }
  .habit-check.checked {
    background: var(--success);
    border-color: var(--success);
    color: var(--success-text);
    animation: checkPop 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes checkPop {
    0% { transform: scale(0.55); }
    65% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .habit-text { flex: 1; min-width: 0; }
  .habit-title { font-size: 13.5px; font-weight: 500; line-height: 1.4; letter-spacing: 0.005em; }
  .habit-title.done { color: var(--text-muted); text-decoration: line-through; }
  .habit-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }
  .streak-badge {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    border: 1px solid var(--border-strong);
    padding: 3px 7px;
    border-radius: 0;
    white-space: nowrap;
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .date-nav button {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 0;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.12s ease, border-color 0.2s ease;
  }
  .date-nav button:active { transform: scale(0.88); }
  .date-nav .cur { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .date-nav .today-link {
    font-size: 10.5px;
    color: var(--accent-text);
    cursor: pointer;
    background: none;
    border: none;
    width: auto;
    height: auto;
    padding: 3px 0 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
  }

  label.field-label {
    display: block;
    font-size: 10.5px;
    color: var(--text-muted);
    margin: 12px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  label.field-label:first-child { margin-top: 0; }
  input[type="number"], input[type="text"], input[type="date"], select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-strong);
    border-radius: 0;
    color: var(--text);
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
    border-radius: 0;
    padding: 10px 16px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-top: 14px;
    width: 100%;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .btn:active { opacity: 0.8; transform: scale(0.98); }
  .btn.secondary {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text);
  }

  .metric-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .metric-pick {
    background: var(--surface);
    border: none;
    border-radius: 0;
    padding: 10px;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    color: var(--text-muted);
  }
  .metric-pick.active {
    color: var(--text);
    background: var(--surface2);
    box-shadow: inset 0 -2px 0 var(--accent);
  }

  .focus-clock-wrap { text-align: center; padding: 22px 0 4px; }
  .focus-clock { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .focus-task-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; }
  .focus-btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .focus-btn-row .btn { margin-top: 0; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .cal-dow-cell {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-bottom: 4px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .cal-cell.empty { border: none; }
  .cal-cell.today { border-color: var(--accent-text); border-width: 2px; }
  .cal-day-num { font-size: 10.5px; color: var(--text); }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .month-cell {
    border: 1px solid var(--border);
    padding: 12px 6px;
    text-align: center;
    cursor: pointer;
  }
  .month-cell.current { border-color: var(--accent-text); border-width: 2px; }
  .month-cell-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .month-cell-pct { font-size: 15px; font-weight: 700; }

  .log-list { margin-top: 4px; }
  .log-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .d { color: var(--text-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .log-entry .v { font-weight: 600; }
  .log-entry .del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
  }

  svg.chart { width: 100%; height: 140px; overflow: visible; }
  .chart-empty {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 24px 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .empty-note {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 10px 0 2px;
  }

  .phase-list-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .phase-list-item:last-child { border-bottom: none; }
  .phase-list-item .ph-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .phase-list-item .ph-name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
  .phase-list-item .ph-range { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .phase-list-item ul { margin: 4px 0 0; padding-left: 16px; }
  .phase-list-item li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; }

  .resource-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .resource-item:last-child { border-bottom: none; }
  .resource-item .r-title { font-weight: 500; }
  .resource-item .r-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.01em; }
  .resource-item.clickable { cursor: pointer; }
  .resource-item.clickable:hover .r-title { color: var(--accent-text); }
  .resource-item .r-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .resource-item .r-arrow { color: var(--text-muted); font-size: 13px; flex: 0 0 auto; }
  .resource-item.clickable:hover .r-arrow { color: var(--accent-text); }

  .add-resource-btn {
    width: 100%;
    background: none;
    border: 1px dashed var(--border-strong);
    color: var(--text-secondary);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 11px;
    cursor: pointer;
    margin-top: 12px;
    border-radius: 0;
  }
  .add-resource-btn:hover { color: var(--text); border-color: var(--text-secondary); }

  /* ---- To-Do tab ---- */
  .todo-heading {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 4px 0 18px;
    color: var(--text);
  }
  .todo-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 90px;
  }
  .todo-pill {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 14px;
    transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
  }
  .todo-pill.completed { opacity: 0.55; }
  .todo-pill.todo-exiting { animation: todoExit 0.3s ease forwards; }
  .todo-pill.todo-entering { animation: todoEnter 0.36s cubic-bezier(.22,1,.36,1) both; }
  @keyframes todoExit { to { opacity: 0; transform: translateY(10px) scale(0.97); } }
  @keyframes todoEnter { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  .todo-checkbox {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1.5px solid var(--border-strong);
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }
  .todo-checkbox:active { transform: scale(0.87); }
  .todo-checkbox.checked {
    background: var(--todo-accent);
    border-color: var(--todo-accent);
    color: var(--todo-accent-ink);
    animation: checkPop 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .todo-checkbox.checked.muted {
    background: var(--border-strong);
    border-color: var(--border-strong);
    color: var(--text-muted);
    animation: none;
  }

  .todo-text {
    flex: 1;
    min-width: 0;
  }
  .todo-text-inner {
    position: relative;
    display: inline-block;
    max-width: 100%;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);

// ---------- Storage ----------

// Apply a full state object (from localStorage or the online database) onto
// the live `state`, filling in defaults for anything missing.
function applyState(data) {
  if (!data) return;
  state.habits = data.habits || {};
  state.metrics = data.metrics || {};
  state.theme = data.theme || null;
  state.myBooks = data.myBooks || [];
  state.points = data.points || { balance: 0, transactions: [] };
  state.missions = data.missions || [];
  state.rewards = data.rewards || [];
  state.todos = data.todos || [];
  state.focusSessions = data.focusSessions || [];
  var focusDefaults = { durationSec: 25 * 60, remainingSec: 25 * 60, running: false, endTs: null, taskId: null };
  state.focus = Object.assign({}, focusDefaults, data.focus || {});
  if (state.focus.running && state.focus.endTs) {
    // Recompute from the absolute end time so a closed tab/app still lands
    // on the right remaining seconds once we're back.
    state.focus.remainingSec = Math.max(0, Math.round((state.focus.endTs - Date.now()) / 1000));
  }
  var savedCfg = data.pointsConfig || {};
  state.pointsConfig = Object.assign({}, POINTS_CONFIG_DEFAULT, savedCfg, {
    habitOverrides: Object.assign({}, POINTS_CONFIG_DEFAULT.habitOverrides, savedCfg.habitOverrides || {})
  });

}

function load() {
  var isFirstRun = !localStorage.getItem(STORE_KEY);
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) applyState(JSON.parse(raw));
  } catch (e) { /* start fresh */ }
  METRICS.forEach(function(m) { if (!state.metrics[m.id]) state.metrics[m.id] = []; });
  if (!state.pointsConfig) state.pointsConfig = Object.assign({}, POINTS_CONFIG_DEFAULT, { habitOverrides: {} });
  if (state.focus.running && state.focus.remainingSec <= 0) {
    completeFocusSession(true); // finished while the app was closed — log it quietly
  }
  if (isFirstRun) {
    state.myBooks.push({ title: "The 48 Laws of Power — Robert Greene" });
    if (STARTING_BALANCE) {
      state.points.balance = STARTING_BALANCE;
      state.points.transactions.push({ id: uid(), date: todayStr(), ts: Date.now(), amount: STARTING_BALANCE, reason: "Starting balance" });
    }

}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { showToast("Could not save — storage unavailable"); }
  scheduleDbSave();
}

// ---------- Manual backup (independent of both localStorage and the db sync) ----------

function backupFilename() {
  var d = new Date();
  var stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return "to-moon-backup-" + stamp + ".json";
}

function backupPayload() {
  var snapshot = JSON.parse(JSON.stringify(state));
  return JSON.stringify({ exportedAt: new Date().toISOString(), state: snapshot }, null, 2);
}

function plainDownload(filename, payload) {
  try {
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast("Backup downloaded");
  } catch (e) {
    showToast("Couldn't start the download");
  }
}

function exportBackup() {
  var filename = backupFilename();
  var payload = backupPayload();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function(downloads){
      if (!downloads) { plainDownload(filename, payload); return; }
      downloads.save({ filename: filename, data: payload }).then(function(){
        showToast("Backup downloaded");
      }).catch(function(){ showToast("Download was cancelled or failed"); });
    }).catch(function(){ plainDownload(filename, payload); });
  } else {
    plainDownload(filename, payload);
  }
}

function importBackupFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var parsed = JSON.parse(reader.result);
      var data = parsed && parsed.state ? parsed.state : parsed; // accept raw state too
      if (!data || typeof data !== "object") throw new Error("bad file");
      applyState(data);
      save();
      render();
      showToast("Backup restored");
    } catch (e) {
      showToast("Couldn't read that file — is it a tracker backup?");
    }
  };
  reader.onerror = function(){ showToast("Couldn't read that file"); };
  reader.readAsText(file);
}

// ---------- Online sync ----------
// localStorage above is the fast, always-available cache. On top of that,
// state is mirrored to ONE online document so it follows you across devices.
// Two possible backends, tried in this order:

//      any host, an APK wrapper). Activates once FIREBASE_CONFIG is filled in.
//   2. Claude Artifact "db" capability — only works when opened as this
//      hosted claude.ai page. Used automatically as a fallback until you
//      set up Firebase.
// Both expose the same doc.get()/.set()/.onSnapshot() shape, so the same
// save/subscribe logic below works for either one unchanged.

// ---- Fill these in from your OWN Firebase project to switch sync to it ----
// Firebase console (console.firebase.google.com) -> Project settings ->
// General -> "Your apps" -> Web app (</>) -> copy the firebaseConfig object.
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyANCZhz9DycTqerGr8QgD-3YX0Fsb60oQU",
  authDomain: "habit-tracker-v2-31361.firebaseapp.com",
  projectId: "habit-tracker-v2-31361",
  storageBucket: "habit-tracker-v2-31361.firebasestorage.app",
  messagingSenderId: "503231379676",
  appId: "1:503231379676:web:0617b051f299622d169c19"
};
// Any path you like — this is the ONE document every device reads/writes.
// Pick your own long random id and use the exact same one in your Firestore
// security rule (see setup notes). Anyone who has your config AND this exact
// path can read/write this doc, so keep it unguessable and don't reuse this
// pattern for anything sensitive.
var FIREBASE_DOC_PATH = "trackers/roof76c8o8m92kq06xq7vr9ije8u";

function firebaseConfigured() {
  return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("YOUR_") !== 0
    && FIREBASE_DOC_PATH.indexOf("REPLACE-WITH") === -1);
}

function initFirebaseSync() {
  try {
    if (typeof firebase === "undefined" || !firebase.initializeApp) { setSyncStatus("offline"); return; }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    var ref = firebase.firestore().doc(FIREBASE_DOC_PATH);
    ref.get().then(function(snap){
      dbDoc = ref;
      if (snap.exists && snap.data()) {
        applyingRemote = true;
        applyState(snap.data());
        applyingRemote = false;
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
        render();
      } else {
        flushDbSave(); // seed the online doc with what we have locally
      }
      subscribeDb();
      setSyncStatus("online");
    }).catch(function(){ setSyncStatus("error"); });
  } catch (e) {
    setSyncStatus("offline");
  }
}

function initSync() {
  if (firebaseConfigured()) { initFirebaseSync(); return; }
  initDb(); // falls back to the Claude Artifact "db" capability, if any
}

var dbDoc = null;
var dbSaveTimer = null;
var dbWriteInProgress = false;
var dbWritePending = false;
var applyingRemote = false;

function setSyncStatus(status) {
  var elm = document.getElementById("syncStatus");
  if (!elm) return;
  if (status === "online") { elm.textContent = "● Synced online"; elm.style.color = "var(--success)"; }
  else if (status === "error") { elm.textContent = "● Sync error — saving locally"; elm.style.color = "var(--coral)"; }
  else { elm.textContent = "● Local only"; elm.style.color = "var(--text-muted)"; }
}

function scheduleDbSave() {
  if (!dbDoc || applyingRemote) return;
  clearTimeout(dbSaveTimer);
  dbSaveTimer = setTimeout(flushDbSave, 500);
}

function flushDbSave() {
  if (!dbDoc) return;
  if (dbWriteInProgress) { dbWritePending = true; return; }
  dbWriteInProgress = true;
  var snapshot = JSON.parse(JSON.stringify(state));
  dbDoc.set(snapshot).then(function(){
    dbWriteInProgress = false;
    setSyncStatus("online");
    if (dbWritePending) { dbWritePending = false; flushDbSave(); }
  }).catch(function(){
    dbWriteInProgress = false;
    setSyncStatus("error");
    if (dbWritePending) { dbWritePending = false; flushDbSave(); }
  });
}

function subscribeDb() {
  if (!dbDoc) return;
  dbDoc.onSnapshot(function(snap){
    if (!snap.exists) return;
    if (snap.metadata.hasPendingWrites) return; // this is our own write echoing back
    applyingRemote = true;
    applyState(snap.data());
    applyingRemote = false;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    render();
  }, function(){
    setSyncStatus("error");
  });
}

function initDb() {
  if (!window.claude || typeof window.claude.use !== "function") { setSyncStatus("offline"); return; }
  window.claude.use("db").then(function(db){
    if (!db) { setSyncStatus("offline"); return; }
    var ref = db.doc("app/state");
    ref.get().then(function(snap){
      dbDoc = ref;
      if (snap.exists && snap.data()) {
        applyingRemote = true;
        applyState(snap.data());
        applyingRemote = false;
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
        render();
      } else {
        flushDbSave(); // seed the online doc with what we have locally
      }
      subscribeDb();
      setSyncStatus("online");
    }).catch(function(){ setSyncStatus("error"); });
  }).catch(function(){ setSyncStatus("offline"); });
}

// ---------- Private Points engine ----------

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function pointsCfg() { return state.pointsConfig; }

function habitPointsFor(habitId) {
  var cfg = pointsCfg();
  var override = cfg.habitOverrides[habitId];
  return (typeof override === "number" && !isNaN(override)) ? override : cfg.habitPoints;
}

// amount can be positive (earn) or negative (spend/reverse)
function recordPoints(amount, reason) {
  if (!amount) return;
  state.points.balance = Math.max(0, state.points.balance + amount);
  state.points.transactions.push({ id: uid(), date: todayStr(), ts: Date.now(), amount: amount, reason: reason });
  save();
}

function spendPoints(amount, reason) {
  if (amount <= 0) return true;
  if (state.points.balance < amount) return false;
  recordPoints(-amount, reason);
  return true;
}

// ---------- Utilities ----------

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr() { return fmtDate(new Date()); }
function addDays(dateStr, n) { var d = parseDate(dateStr); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
function prettyDate(s) {
  var d = parseDate(s);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function shortDate(s) {
  var d = parseDate(s);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

function currentPhase() {
  var today = todayStr();
  for (var i = 0; i < PHASES.length; i++) {
    var p = PHASES[i];
    var end = addDays(p.start, p.days);
    if (today < p.start) return { phase: p, index: i, status: "upcoming" };
    if (today >= p.start && today < end) return { phase: p, index: i, status: "active" };
  }
  return { phase: PHASES[PHASES.length - 1], index: PHASES.length - 1, status: "complete" };
}

function habitsForDate(dateStr) {
  if (!state.habits[dateStr]) state.habits[dateStr] = {};
  return state.habits[dateStr];
}

function habitStreak(habitId) {
  var streak = 0;
  var d = todayStr();
  // if today not done yet, start counting from yesterday
  var todayDone = state.habits[d] && state.habits[d][habitId];
  if (!todayDone) d = addDays(d, -1);
  while (state.habits[d] && state.habits[d][habitId]) {
    streak++;
    d = addDays(d, -1);
  }
  return streak;
}

function completionRate(dateStr) {
  var rec = state.habits[dateStr] || {};
  var done = HABITS.filter(function(h){ return rec[h.id]; }).length;
  return { done: done, total: HABITS.length };
}

function shiftMonth(ym, delta) {
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  m += delta;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return y + "-" + pad(m);
}

// Habit + points stats over an inclusive date range, for the Progress tab
function statsForRange(startStr, endStr) {
  var daysLogged = 0, totalChecks = 0, daysWithData = 0, sumRate = 0;
  Object.keys(state.habits).forEach(function(d) {
    if (d < startStr || d > endStr) return;
    var rec = state.habits[d];
    var done = HABITS.filter(function(h) { return rec[h.id]; }).length;
    if (done > 0) daysLogged++;
    totalChecks += done;
    daysWithData++;
    sumRate += done / HABITS.length;
  });
  var netPoints = 0, earnedPoints = 0, spentPoints = 0;
  state.points.transactions.forEach(function(t) {
    if (t.date < startStr || t.date > endStr) return;
    netPoints += t.amount;
    if (t.amount > 0) earnedPoints += t.amount; else spentPoints += -t.amount;
  });
  return {
    daysLogged: daysLogged, totalChecks: totalChecks, daysWithData: daysWithData,
    avgRate: daysWithData ? sumRate / daysWithData : 0,
    netPoints: netPoints, earnedPoints: earnedPoints, spentPoints: spentPoints
  };
}

function overallStats() {
  var totalDaysLogged = Object.keys(state.habits).filter(function(d){
    return Object.values(state.habits[d]).some(Boolean);
  }).length;
  var totalChecks = 0;
  Object.keys(state.habits).forEach(function(d){
    HABITS.forEach(function(h){ if (state.habits[d][h.id]) totalChecks++; });
  });
  var bestStreak = 0;
  HABITS.forEach(function(h){
    var s = habitStreak(h.id);
    if (s > bestStreak) bestStreak = s;
  });
  return { totalDaysLogged: totalDaysLogged, totalChecks: totalChecks, bestStreak: bestStreak };
}

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  if (children) children.forEach(function(c){ if (c) e.appendChild(c); });
  return e;
}
function text(s) { return document.createTextNode(s); }

function renderChart(metricId) {
  var entries = (state.metrics[metricId] || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var wrap = document.createElement("div");
  if (entries.length < 2) {
    wrap.appendChild(el("div", { class: "chart-empty" }, [text(entries.length === 0 ? "No entries yet — log your first below" : "Log one more entry to see a trend")]));
    return wrap;
  }
  var w = 640, h = 140, padL = 34, padR = 10, padT = 14, padB = 22;
  var vals = entries.map(function(e){ return e.value; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  var xStep = (w - padL - padR) / (entries.length - 1);
  function xAt(i){ return padL + i * xStep; }
  function yAt(v){ return padT + (1 - (v - min) / (max - min)) * (h - padT - padB); }

  var pts = entries.map(function(e,i){ return xAt(i) + "," + yAt(e.value); }).join(" ");

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  var accentVar = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#7f77dd";

  // gridlines
  [0, 0.5, 1].forEach(function(f){
    var y = padT + f * (h - padT - padB);
    var line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", padL); line.setAttribute("x2", w - padR);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", "currentColor");
    line.setAttribute("stroke-opacity", "0.12");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);
  });

  var labelMax = document.createElementNS(svgNS, "text");
  labelMax.setAttribute("x", 2); labelMax.setAttribute("y", padT + 4);
  labelMax.setAttribute("font-size", "10"); labelMax.setAttribute("fill", "currentColor"); labelMax.setAttribute("opacity", "0.5");
  labelMax.textContent = Math.round(max * 10) / 10;
  svg.appendChild(labelMax);
  var labelMin = document.createElementNS(svgNS, "text");
  labelMin.setAttribute("x", 2); labelMin.setAttribute("y", h - padB + 4);
  labelMin.setAttribute("font-size", "10"); labelMin.setAttribute("fill", "currentColor"); labelMin.setAttribute("opacity", "0.5");
  labelMin.textContent = Math.round(min * 10) / 10;
  svg.appendChild(labelMin);

  var poly = document.createElementNS(svgNS, "polyline");
  poly.setAttribute("points", pts);
  poly.setAttribute("fill", "none");
  poly.setAttribute("stroke", accentVar);
  poly.setAttribute("stroke-width", "2");
  poly.setAttribute("stroke-linejoin", "round");
  poly.setAttribute("stroke-linecap", "round");
  svg.appendChild(poly);

  entries.forEach(function(e, i){
    var c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", xAt(i)); c.setAttribute("cy", yAt(e.value));
    c.setAttribute("r", "3"); c.setAttribute("fill", accentVar);
    svg.appendChild(c);
  });

  // first/last date labels
  var dFirst = document.createElementNS(svgNS, "text");
  dFirst.setAttribute("x", padL); dFirst.setAttribute("y", h - 4);
  dFirst.setAttribute("font-size", "10"); dFirst.setAttribute("fill", "currentColor"); dFirst.setAttribute("opacity", "0.5");
  dFirst.textContent = shortDate(entries[0].date);
  svg.appendChild(dFirst);
  var dLast = document.createElementNS(svgNS, "text");
  dLast.setAttribute("x", w - padR); dLast.setAttribute("y", h - 4);
  dLast.setAttribute("text-anchor", "end");
  dLast.setAttribute("font-size", "10"); dLast.setAttribute("fill", "currentColor"); dLast.setAttribute("opacity", "0.5");
  dLast.textContent = shortDate(entries[entries.length-1].date);
  svg.appendChild(dLast);

  wrap.appendChild(svg);
  return wrap;
}

function appendMonthProgress(frag) {
  var ym = view.progressMonth;
  var year = +ym.slice(0, 4), month = +ym.slice(5, 7);
  var start = ym + "-01";
  var dim = new Date(year, month, 0).getDate();
  var end = ym + "-" + pad(dim);
  var monthLabel = new Date(year, month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  var curMonth = todayStr().slice(0, 7);

  var navCard = el("div", { class: "card" });
  navCard.appendChild(el("div", { class: "date-nav" }, [
    el("button", {
      onclick: function(){ view.progressMonth = shiftMonth(ym, -1); render(); },
      "aria-label": "Previous month"
    }, [text("‹")]),
    el("div", {}, [ el("div", { class: "cur" }, [text(monthLabel)]) ]),
    el("button", {
      onclick: function(){ var n = shiftMonth(ym, 1); if (n <= curMonth) { view.progressMonth = n; render(); } },
      "aria-label": "Next month",
      style: ym >= curMonth ? "opacity:0.3;cursor:default" : ""
    }, [text("›")])
  ]));

  var st = statsForRange(start, end < todayStr() ? end : todayStr());
  navCard.appendChild(el("div", { class: "stat-grid", style: "margin-top:14px" }, [
    el("div", { class: "stat" }, [el("div", { class: "label" }, [text("Days logged")]), el("div", { class: "value" }, [text(st.daysLogged + "/" + dim)])]),
    el("div", { class: "stat" }, [el("div", { class: "label" }, [text("Avg completion")]), el("div", { class: "value" }, [text(Math.round(st.avgRate * 100) + "%")])]),
    el("div", { class: "stat" }, [el("div", { class: "label" }, [text("Check-ins")]), el("div", { class: "value" }, [text("" + st.totalChecks)])]),
    el("div", { class: "stat" }, [el("div", { class: "label" }, [text("Net points")]), el("div", { class: "value" }, [text((st.netPoints >= 0 ? "+" : "-") + Math.abs(st.netPoints))])])
  ]));
  frag.appendChild(navCard);

  var calCard = el("div", { class: "card" }, [el("h2", {}, [text("Daily completion")])]);
  var dow = el("div", { class: "cal-grid" });
  ["S", "M", "T", "W", "T", "F", "S"].forEach(function(d){ dow.appendChild(el("div", { class: "cal-dow-cell" }, [text(d)])); });
  calCard.appendChild(dow);
  var grid = el("div", { class: "cal-grid" });
  var firstDow = new Date(year, month - 1, 1).getDay();
  for (var i = 0; i < firstDow; i++) grid.appendChild(el("div", { class: "cal-cell empty" }));
  for (var day = 1; day <= dim; day++) {
    var ds = ym + "-" + pad(day);
    var isFuture = ds > todayStr();
    var rec = completionRate(ds);
    var rate = rec.total ? rec.done / rec.total : 0;
    var cellStyle = isFuture ? "" : "background-color:var(--accent);opacity:" + (rec.done > 0 ? Math.max(0.15, rate) : 0.05) + ";";
    grid.appendChild(el("div", {
      class: "cal-cell" + (ds === todayStr() ? " today" : ""),
      style: cellStyle,
      title: ds + ": " + rec.done + "/" + rec.total + " habits"
    }, [el("span", { class: "cal-day-num" }, [text("" + day)])]));
  }
  calCard.appendChild(grid);
  frag.appendChild(calCard);
}

function renderTodoPill(td, settled) {
  var checkbox = el("button", {
    class: "todo-checkbox" + (td.done ? " checked" : "") + (settled && td.done ? " muted" : ""),
    type: "button",
    "aria-label": (td.done ? "Mark incomplete: " : "Mark complete: ") + td.text
  }, [text("✓")]);

  var textInner = el("span", { class: "todo-text-inner" + (td.done ? " done" : "") }, [
    text(td.text),
    el("span", { class: "todo-strike" })
  ]);
  var textWrap = el("div", { class: "todo-text" }, [textInner]);

  var delBtn = el("button", {
    class: "todo-del",
    type: "button",
    "aria-label": "Delete task"
  }, [text("×")]);

  var pill = el("div", {
    class: "todo-pill" + (settled && td.done ? " completed" : "") + (todoLastSettledId && td.id === todoLastSettledId ? " todo-entering" : "")
  }, [checkbox, textWrap, delBtn]);

  if (todoLastSettledId && td.id === todoLastSettledId) todoLastSettledId = null;

  delBtn.addEventListener("click", function(){
    state.todos = state.todos.filter(function(x){ return x !== td; });
    save();
    pill.classList.add("todo-exiting");
    setTimeout(render, 260);
  });

  checkbox.addEventListener("click", function(){
    if (td.done) {
      // Unchecking — pull it straight back into the open list
      td.done = false;
      save();
      render();
      return;
    }
    // Checking — draw the strike-through, then settle it into Completed
    checkbox.classList.add("checked");
    textInner.classList.add("animating");
    setTimeout(function(){
      td.done = true;
      todoLastSettledId = td.id;
      save();
      pill.classList.add("todo-exiting");
      setTimeout(render, 300);
    }, 380);
  });

  return pill;
}

// ---------- Focus timer ----------
// state.focus holds the live/paused timer; state.focusSessions is the log.
// A finished session marks today's "pomodoro" habit done (awarding its
// habit points the first time only) and logs its length into the
// "focus_min" ("Longest focus span") metric, taking the max for the day —
// so Focus sessions feed straight into the existing habit + metrics system.

function fmtClock(totalSec) {
  var s = Math.max(0, Math.round(totalSec));
  var m = Math.floor(s / 60);
  var r = s % 60;
  return (m < 10 ? "0" + m : "" + m) + ":" + pad(r);
}

function focusSessionsToday() {
  var d = todayStr();
  return state.focusSessions.filter(function(s){ return s.date === d; });
}

function startFocusTimer() {
  var f = state.focus;
  f.running = true;
  f.endTs = Date.now() + f.remainingSec * 1000;
  save();
  render();
}

function pauseFocusTimer() {
  var f = state.focus;
  if (!f.running) return;
  f.remainingSec = Math.max(0, Math.round((f.endTs - Date.now()) / 1000));
  f.running = false;
  f.endTs = null;
  save();
  render();
}

function resetFocusTimer() {
  var f = state.focus;
  f.running = false;
  f.endTs = null;
  f.remainingSec = f.durationSec;
  save();
  render();
}

function setFocusDuration(minutes) {
  var f = state.focus;
  if (f.running || f.remainingSec !== f.durationSec) return; // only while fresh, before starting
  f.durationSec = Math.round(minutes * 60);
  f.remainingSec = f.durationSec;
  save();
  render();
}

function setFocusTask(taskId) {
  state.focus.taskId = taskId || null;
  save();
}

function tickFocusTimer() {
  var f = state.focus;
  if (!f.running) return;
  var remaining = Math.max(0, Math.round((f.endTs - Date.now()) / 1000));
  f.remainingSec = remaining;
  if (remaining <= 0) {
    completeFocusSession();
  } else {
    save();
    if (view.tab === "focus") render();
  }
}

function completeFocusSession(silent) {
  var f = state.focus;
  var minutes = Math.round((f.durationSec / 60) * 10) / 10;
  var task = f.taskId ? state.todos.filter(function(t){ return t.id === f.taskId; })[0] : null;
  state.focusSessions.push({
    id: uid(), date: todayStr(), minutes: minutes,
    taskId: f.taskId || null, taskText: task ? task.text : null,
    endedAt: Date.now()
  });

  var dayRec = habitsForDate(todayStr());
  var pts = 0;
  if (!dayRec.pomodoro) {
    dayRec.pomodoro = true;
    pts = habitPointsFor("pomodoro");
    recordPoints(pts, "Focus session: " + minutes + " min");
  }

  var mList = state.metrics.focus_min;
  var d = todayStr();
  var existingEntry = mList.filter(function(e){ return e.date === d; })[0];
  var metricIsNew = !existingEntry;
  if (existingEntry) { if (minutes > existingEntry.value) existingEntry.value = minutes; }
  else mList.push({ date: d, value: minutes });
  var cfg = pointsCfg();
  if (metricIsNew && cfg.metricLogPoints > 0) {
    recordPoints(cfg.metricLogPoints, "Logged metric: Longest focus span");
  }

  f.running = false;
  f.endTs = null;
  f.remainingSec = f.durationSec;
  save();

  if (!silent) {
    showToast("Focus session complete" + (pts > 0 ? " — +" + pts + " pts" : ""));
    if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch (e) {} }
    if (view.tab === "focus") render();
  }
}

function initFocusTimer() {
  setInterval(function(){ tickFocusTimer(); }, 1000);
}

function renderFocus() {
  var frag = document.createDocumentFragment();
  var f = state.focus;
  var fresh = !f.running && f.remainingSec === f.durationSec;
  var openTasks = state.todos.filter(function(t){ return !t.done; });
  var linkedTask = f.taskId ? state.todos.filter(function(t){ return t.id === f.taskId; })[0] : null;

  var card = el("div", { class: "card" }, [
    el("h2", {}, [text("Focus session")])
  ]);

  if (fresh) {
    card.appendChild(el("label", { class: "field-label" }, [text("Duration")]));
    var presetGrid = el("div", { class: "metric-select-grid" }, FOCUS_PRESETS.map(function(mins){
      return el("button", {
        class: "metric-pick" + (Math.round(f.durationSec / 60) === mins ? " active" : ""),
        type: "button",
        onclick: function(){ setFocusDuration(mins); }
      }, [text(mins + " min")]);
    }));
    card.appendChild(presetGrid);

    var customInput = el("input", { type: "number", min: "1", step: "1", value: String(Math.round(f.durationSec / 60)) });
    customInput.addEventListener("change", function(){
      var v = parseInt(customInput.value, 10);
      if (!isNaN(v) && v > 0) setFocusDuration(v);
    });
    card.appendChild(el("label", { class: "field-label" }, [text("Custom (min)")]));
    card.appendChild(customInput);

    card.appendChild(el("label", { class: "field-label" }, [text("Link to a task (optional)")]));
    var select = el("select", {}, [el("option", { value: "" }, [text("No task")])]);
    openTasks.forEach(function(t){
      var opt = el("option", { value: t.id }, [text(t.text)]);
      if (t.id === f.taskId) opt.setAttribute("selected", "selected");
      select.appendChild(opt);
    });
    select.addEventListener("change", function(){ setFocusTask(select.value); });
    card.appendChild(select);
  }

  var clockWrap = el("div", { class: "focus-clock-wrap" }, [
    el("div", { class: "focus-clock" }, [text(fmtClock(f.remainingSec))])
  ]);
  if (linkedTask) clockWrap.appendChild(el("div", { class: "focus-task-label" }, [text("On: " + linkedTask.text)]));
  card.appendChild(clockWrap);

  var elapsedFrac = f.durationSec > 0 ? Math.min(1, Math.max(0, 1 - f.remainingSec / f.durationSec)) : 0;
  card.appendChild(el("div", { class: "progress-track", style: "margin-top:10px" }, [
    el("div", { class: "progress-fill", style: "width:" + Math.round(elapsedFrac * 100) + "%" })
  ]));

  var btnRow = el("div", { class: "focus-btn-row" });
  if (fresh) {
    var startBtn = el("button", { class: "btn", type: "button" }, [text("Start focus")]);
    startBtn.addEventListener("click", startFocusTimer);
    btnRow.appendChild(startBtn);
  } else if (f.running) {
    var pauseBtn = el("button", { class: "btn secondary", type: "button" }, [text("Pause")]);
    pauseBtn.addEventListener("click", pauseFocusTimer);
    var endBtn = el("button", { class: "btn secondary", type: "button" }, [text("End session")]);
    endBtn.addEventListener("click", resetFocusTimer);
    btnRow.appendChild(pauseBtn);
    btnRow.appendChild(endBtn);
  } else {
    var resumeBtn = el("button", { class: "btn", type: "button" }, [text("Resume")]);
    resumeBtn.addEventListener("click", startFocusTimer);
    var resetBtn = el("button", { class: "btn secondary", type: "button" }, [text("Reset")]);
    resetBtn.addEventListener("click", resetFocusTimer);
    btnRow.appendChild(resumeBtn);
    btnRow.appendChild(resetBtn);
  }
  card.appendChild(btnRow);
  frag.appendChild(card);

  var todaySessions = focusSessionsToday();
  var totalMin = todaySessions.reduce(function(sum, s){ return sum + s.minutes; }, 0);
  var statsCard = el("div", { class: "card" }, [
    el("div", { class: "stat-grid" }, [
      el("div", { class: "stat" }, [
        el("div", { class: "label" }, [text("Sessions today")]),
        el("div", { class: "value" }, [text(String(todaySessions.length))])
      ]),
      el("div", { class: "stat" }, [
        el("div", { class: "label" }, [text("Minutes today")]),
        el("div", { class: "value" }, [text(String(Math.round(totalMin * 10) / 10))])
      ])
    ])
  ]);
  frag.appendChild(statsCard);

  if (todaySessions.length) {
    var logCard = el("div", { class: "card" }, [el("h2", {}, [text("Today's sessions")])]);
    var logList = el("div", { class: "log-list" });
    todaySessions.slice().reverse().forEach(function(s){
      var row = el("div", { class: "log-entry" }, [
        el("div", {}, [
          el("div", { class: "v" }, [text(s.minutes + " min" + (s.taskText ? " — " + s.taskText : ""))]),
          el("div", { class: "d" }, [text(new Date(s.endedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))])
        ]),
        el("button", {
          class: "del", "aria-label": "Delete session",
          onclick: function(){
            state.focusSessions = state.focusSessions.filter(function(x){ return x !== s; });
            save(); render();
          }
        }, [text("×")])
      ]);
      logList.appendChild(row);
    });
    logCard.appendChild(logList);
    frag.appendChild(logCard);
  }

  return frag;
}

    item.setAttribute("tabindex", "0");
    item.addEventListener("click", openHandler);
    item.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openHandler(); } });

    var delBtn = el("button", {
      class: "log-entry del",
      style: "padding:0;margin-top:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)",
      onclick: function(e){
        e.stopPropagation();
        state.myBooks.splice(idx, 1);
        save();
        render();
      }
    }, [text("Remove")]);
    item.appendChild(delBtn);
    myCard.appendChild(item);
  });

  var addBtn = el("button", { class: "add-resource-btn", type: "button" }, [text("+ Add a PDF")]);
  addBtn.addEventListener("click", function(){
    var title = window.prompt("Title for this book?");
    if (title === null) return;
    title = title.trim();
    if (!title) { showToast("Enter a title first"); return; }
    fileInput.onchange = function(){
      if (!fileInput.files || !fileInput.files[0]) return;
      state.myBooks.push({ title: title });
      save();
      openPickedFile();
      render();
    };
    fileInput.click();
  });
  myCard.appendChild(addBtn);
  frag.appendChild(myCard);

  // ---- Curated resources ----
  var card = el("div", { class: "card" }, [
    el("h2", {}, [text("Books, apps, courses")])
  ]);
  RESOURCES.forEach(function(r){
    card.appendChild(el("div", { class: "resource-item" }, [
      el("div", { class: "r-title" }, [text(r.title)]),
      el("div", { class: "r-note" }, [text(r.note)])
    ]));
  });
  frag.appendChild(card);

  var ethicsCard = el("div", { class: "card" }, [
    el("h2", {}, [text("Keep in mind")]),
    el("div", { style: "font-size:13.5px;color:var(--text-secondary);line-height:1.7" }, [
      text("Ethical persuasion, not manipulation — honesty and respect over reading people to exploit them. Balance intense training with real recovery: sleep, leisure, social support. Watch for burnout, especially with stress-exposure work.")
    ])
  ]);
  frag.appendChild(ethicsCard);


  return frag;
}

var lastRenderedTab = null;
var suppressEnterAnim = false;
var renderQueued = false;

function tabIndexOf(id) {
  for (var i = 0; i < TABS.length; i++) { if (TABS[i].id === id) return i; }
  return -1;
}

function contentForTab(tabId) {
  if (tabId === "today") return renderToday();
  if (tabId === "todo") return renderTodo();
  if (tabId === "focus") return renderFocus();
  if (tabId === "phases") return renderPhases();
  if (tabId === "metrics") return renderMetrics();
  if (tabId === "progress") return renderProgress();
  if (tabId === "points") return renderPoints();
  return renderResources();
}

function render() {
  // A checkbox/delete timer (or a remote sync update) can fire mid-swipe.
  // Rebuilding #content right now would yank the swipe-track out from
  // under an active drag. Defer — the drag's own settle() re-renders
  // when it finishes, and that will already reflect the latest state.
  if (document.body.classList.contains("swiping")) { renderQueued = true; return; }
  renderQueued = false;
  renderTabs();
  var content = document.getElementById("content");
  var directionClass = null;
  if (lastRenderedTab !== null && lastRenderedTab !== view.tab && !suppressEnterAnim) {
    directionClass = tabIndexOf(view.tab) > tabIndexOf(lastRenderedTab) ? "tab-in-right" : "tab-in-left";
  }
  suppressEnterAnim = false;
  lastRenderedTab = view.tab;
  content.classList.remove("tab-in-right", "tab-in-left");
  content.style.transform = "";
  content.style.transition = "";
  content.innerHTML = "";
  content.appendChild(contentForTab(view.tab));
  if (directionClass) {
    void content.offsetWidth;
    content.classList.add(directionClass);
  }
}

// ---------- Theme toggle ----------

function initTheme() {
  if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("themeToggle").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    // detect system default to allow a clean toggle
    if (!cur) {
      var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      next = systemDark ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", next);
    state.theme = next;
    save();
  });
}

// ---------- Swipe between tabs ----------

function initSwipeNav() {
  var content = document.getElementById("content");
  var startX = 0, startY = 0, tracking = false, horizontal = false;
  var dragging = false;      // true once we've committed to a horizontal swipe gesture
  var dir = 0;                // -1 = moving to next tab, +1 = moving to prev tab, 0 = edge rubber-band only
  var track = null, panelW = 0;
  var lastX = 0, lastT = 0, velocity = 0;
  var DISTANCE_RATIO = 0.28;  // fraction of panel width needed to commit
  var VELOCITY_COMMIT = 0.5;  // px/ms flick speed that commits regardless of distance
  var EASE = "cubic-bezier(.22,.61,.36,1)";
  var rafId = null, pendingDx = 0, haveDrag = false;

  function scheduleDrag(dx) {
    pendingDx = dx;
    haveDrag = true;
    if (rafId === null) rafId = requestAnimationFrame(flushDrag);
  }

  function flushDrag() {
    rafId = null;
    if (!haveDrag) return;
    haveDrag = false;
    applyDragNow(pendingDx);
  }

  function neighborId(step) {
    var idx = tabIndexOf(view.tab);
    var n = idx + step;
    if (n < 0 || n >= TABS.length) return null;
    return TABS[n].id;
  }

  function beginDrag(initialDx) {
    dragging = true;
    document.body.classList.add("swiping");
    dir = initialDx < 0 ? -1 : 1;
    var nId = neighborId(dir === -1 ? 1 : -1);
    panelW = content.getBoundingClientRect().width;

    if (!nId) {
      // No neighbor that way — plain rubber-band on the live content, no track needed.
      dir = 0;
      track = null;
      content.style.transition = "";
      return;
    }

    var curFrag = document.createDocumentFragment();
    while (content.firstChild) curFrag.appendChild(content.firstChild);
    var curPanel = el("div", { class: "swipe-panel" });
    curPanel.appendChild(curFrag);
    var nextPanel = el("div", { class: "swipe-panel" });
    nextPanel.appendChild(contentForTab(nId));

    track = el("div", { class: "swipe-track" });
    if (dir === -1) { track.appendChild(curPanel); track.appendChild(nextPanel); }
    else { track.appendChild(nextPanel); track.appendChild(curPanel); }
    track.style.transition = "";
    content.appendChild(track);
  }

  function applyDrag(dx) {
    if (!dragging) return;
    scheduleDrag(dx);
  }

  function applyDragNow(dx) {
    if (!dragging) return;
    if (!track) {
      // rubber-band, clamped and damped
      var rb = Math.max(-42, Math.min(42, dx * 0.35));
      content.style.transform = "translate3d(" + rb + "px,0,0)";
      return;
    }
    if (dir === -1) dx = Math.max(-panelW, Math.min(0, dx));
    else dx = Math.max(0, Math.min(panelW, dx));
    var basePct = dir === -1 ? 0 : -50;
    track.style.transform = "translate3d(calc(" + basePct + "% + " + dx + "px),0,0)";
  }

  function settle(dx) {
    if (!dragging) { tracking = false; return; }
    dragging = false;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; haveDrag = false; }

    if (!track) {
      // spring the rubber-band back to rest
      content.style.transition = "transform 220ms " + EASE;
      content.style.transform = "translate3d(0,0,0)";
      setTimeout(function(){
        content.style.transition = "";
        content.style.transform = "";
        document.body.classList.remove("swiping");
        if (renderQueued) render();
      }, 230);
      tracking = false;
      return;
    }

    var progress = Math.abs(dx) / panelW;
    var fastFlick = Math.abs(velocity) > VELOCITY_COMMIT && (dx < 0 ? dir === -1 : dir === 1);
    var commit = fastFlick || progress > DISTANCE_RATIO;

    var targetPct = commit ? (dir === -1 ? -50 : 0) : (dir === -1 ? 0 : -50);
    track.style.transition = "transform 240ms " + EASE;
    void track.offsetWidth;
    track.style.transform = "translate3d(" + targetPct + "%,0,0)";

    setTimeout(function(){
      document.body.classList.remove("swiping");
      if (commit) {
        var nId = neighborId(dir === -1 ? 1 : -1);
        if (nId) {
          suppressEnterAnim = true;
          view.tab = nId;
          render();
          var nav = document.getElementById("tabs");
          var activeBtn = nav.querySelector(".tab.active");
          if (activeBtn && activeBtn.scrollIntoView) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          tracking = false;
          return;
        }
      }
      // cancelled — just rebuild the current tab cleanly
      render();
      tracking = false;
    }, 250);
  }

  content.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1 || dragging) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    lastX = startX; lastT = e.timeStamp; velocity = 0;
    tracking = true;
    horizontal = false;
  }, { passive: true });

  content.addEventListener("touchmove", function(e){
    if (!tracking || e.touches.length !== 1) return;
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    var dx = x - startX;
    var dy = y - startY;
    if (!horizontal && !dragging) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        if (Math.abs(dx) > Math.abs(dy)) {
          horizontal = true;
          beginDrag(dx);
        } else {
          tracking = false; // vertical scroll wins, let the page handle it
          return;
        }
      }
    }
    if (horizontal) {
      if (e.cancelable) e.preventDefault();
      var dt = e.timeStamp - lastT;
      if (dt > 0) velocity = (x - lastX) / dt;
      lastX = x; lastT = e.timeStamp;
      applyDrag(dx);
    }
  }, { passive: false });

  content.addEventListener("touchend", function(e){
    if (!tracking) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (!horizontal) { tracking = false; return; }
    settle(dx);
  });
  content.addEventListener("touchcancel", function(){
    if (dragging) { velocity = 0; settle(0); }
    tracking = false;
  });
}

// ---------- Background live wallpaper ----------

function initBgVideo() {
  var v = document.getElementById("bgVideo");
  if (!v) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { v.pause(); return; }
  v.play().catch(function(){});
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) v.pause();
    else v.play().catch(function(){});
  });
}

// ---------- Keep #content tall enough to always be swipeable ----------
// #content has no explicit height, so on short tabs (few/no todos) there's
// blank space below it that belongs to #app/body, not #content — and since
// the swipe listeners live on #content, touches starting in that gap never
// reach them. Force a minimum height down to the bottom of the viewport.
function fitContentMinHeight() {
  var header = document.querySelector("header.top");
  var content = document.getElementById("content");
  if (!header || !content) return;
  var headerBottom = header.getBoundingClientRect().bottom;
  var appEl = document.getElementById("app");
  var appPadBottom = appEl ? parseFloat(getComputedStyle(appEl).paddingBottom) || 0 : 0;
  var minH = window.innerHeight - headerBottom - appPadBottom;
  content.style.minHeight = Math.max(minH, 0) + "px";
}
window.addEventListener("resize", fitContentMinHeight);
window.addEventListener("orientationchange", fitContentMinHeight);

// ---------- Init ----------

load();
initTheme();
render();
initSync();
initSwipeNav();
initBgVideo();
initFocusTimer();
fitContentMinHeight();

})();
</script>
